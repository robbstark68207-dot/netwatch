name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Arrange project folders
        run: |
          mkdir -p app/src/main/java/com/netwatch/app app/src/main/res/values
          mv app-build.gradle.kts app/build.gradle.kts
          mv AndroidManifest.xml app/src/main/
          mv themes.xml app/src/main/res/values/
          mv NetWatch.kt app/src/main/java/com/netwatch/app/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NetWatch-apk
          path: app/build/outputs/apk/debug/app-debug.apk
